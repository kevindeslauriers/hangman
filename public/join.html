<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1fb5">
<title>Class Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Atkinson+Hyperlegible:wght@400;700&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b33;--panel:#0f1a6b;--line:#3446c9;--gold:#ffcc33;--ok:#47e08a;--bad:#ff7a8a;--text:#fff;--soft:#c9d3ff;--team:#888}
*,*::before,*::after{box-sizing:border-box}
html{background:#02030f}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at 50% 0%,#14207a 0%,#070b33 65%,#02030f 100%) fixed;color:var(--text);
  font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:clamp(17px,1.25vw + 8px,22px);line-height:1.35}
#app{max-width:860px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 32px;display:flex;flex-direction:column;gap:14px;min-height:100vh;min-height:100dvh}
[hidden]{display:none!important}
h1,h2{font-family:"Anton",sans-serif;font-weight:400;letter-spacing:.03em;margin:0;line-height:1.1}
h1{font-size:2em;color:var(--gold)}
h2{font-size:1.5em}
p{margin:0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 12px;border-radius:12px;background:rgba(5,10,60,.7);border:2px solid var(--line)}
.bar .who{font-weight:700}
.bar .tm{display:inline-flex;align-items:center;gap:6px;font-family:"Oswald",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.dot{width:.8em;height:.8em;border-radius:50%;background:var(--team);display:inline-block}
.bar .sc{font-family:"Anton",sans-serif;letter-spacing:.03em}
.card{background:rgba(15,26,107,.85);border:2px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.label{font-family:"Oswald",sans-serif;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-size:.8em}
.field{width:100%;font:inherit;font-size:1.1em;padding:.55em .7em;border-radius:10px;border:2px solid var(--line);background:#fff;color:#0b1255}
.field:focus{outline:3px solid var(--gold);outline-offset:1px}
.code{text-transform:uppercase;letter-spacing:.3em;font-family:"Anton",sans-serif}
.btn{font:inherit;font-weight:700;padding:.6em 1em;border-radius:10px;border:2px solid #6f86ff;background:linear-gradient(#2e4bff,#0b1fa8);color:#fff;cursor:pointer;touch-action:manipulation}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.primary{background:linear-gradient(#ffe48a,#e0a800);color:#04155a;border-color:#ffe48a}
.btn.small{font-size:.75em;padding:.3em .7em}
.row{display:flex;gap:10px;align-items:stretch}
.row .field{flex:1;min-width:0}
.toast{color:var(--bad);min-height:1.3em;font-weight:700}
.status{color:var(--soft);font-size:.85em;min-height:1.1em}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.teams .btn{display:flex;align-items:center;gap:8px;justify-content:flex-start;background:#0b1255;border-width:3px}
.teams .btn.on{background:#1b2a8a;box-shadow:0 0 0 3px var(--gold)}
.teams .btn small{margin-left:auto;opacity:.7;font-weight:400}
.mates{color:var(--soft);font-size:.9em}
.big{font-family:"Anton",sans-serif;font-size:1.6em;letter-spacing:.03em}
.cat{display:flex;justify-content:space-between;gap:10px;font-family:"Oswald",sans-serif;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.cat b{font-family:"Anton",sans-serif;font-weight:400;color:var(--gold);letter-spacing:.03em}
.q{font-size:1.35em;font-weight:700;line-height:1.35}
sup{font-size:.62em}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.choices{grid-template-columns:1fr}}
.choice{display:flex;align-items:center;gap:12px;text-align:left;min-height:3.4em;font-size:1.05em;background:#0b1255;border:3px solid var(--line)}
.choice .k{font-family:"Anton",sans-serif;font-weight:400;color:var(--gold);font-size:1.2em;width:1.2em;flex:none}
.choice.picked{border-color:var(--gold);background:#1b2a8a}
.choice.right{border-color:var(--ok);background:#0c4a2b}
.choice.wrongpick{border-color:var(--bad);background:#4a0c1a}
.hint{color:var(--soft);font-size:.85em}
.timer{height:10px;border-radius:6px;background:rgba(255,255,255,.15);overflow:hidden}
.timer i{display:block;height:100%;background:linear-gradient(90deg,#ff3b3b,#ffcc33);transform-origin:left}
.secs{font-family:"Anton",sans-serif;font-size:1.3em;text-align:right;min-width:2em}
.secs.low{color:var(--bad)}
.locked{padding:10px 14px;border-radius:10px;background:rgba(255,255,255,.08);border:2px dashed var(--soft)}
.result{font-family:"Anton",sans-serif;font-size:2.4em;letter-spacing:.03em;line-height:1}
.result.ok{color:var(--ok)}.result.no{color:var(--bad)}
.answer{font-size:1.2em}
.answer b{color:var(--gold)}
.mini{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.mini .col{display:flex;flex-direction:column;gap:6px}
.mini .h{font-family:"Oswald",sans-serif;font-weight:600;font-size:.62em;text-transform:uppercase;text-align:center;min-height:3.4em;display:flex;align-items:center;justify-content:center;
  background:#0a1fb5;border-radius:6px;padding:4px;line-height:1.1;word-break:break-word}
.mini .btn{padding:.5em 0;font-family:"Anton",sans-serif;font-weight:400;color:var(--gold);background:linear-gradient(#1c34e0,#060f6e)}
.mini .btn:disabled{opacity:.15}
@media (max-width:560px){.mini{grid-template-columns:repeat(3,minmax(0,1fr))}}
.scores{display:grid;gap:6px}
.scores .t{display:grid;grid-template-columns:.8em 1fr auto;gap:8px;align-items:center;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.05)}
.scores .t.me{outline:2px solid var(--gold)}
.scores .t b{font-family:"Anton",sans-serif;font-weight:400}
.neg{color:var(--bad)}
.leave{margin-top:auto;align-self:flex-start}
.kbd{font-size:.75em;color:var(--soft)}
</style>
</head>
<body>
<div id="app"></div>
<script src="/conn.js"></script>
<script src="/class-student.js"></script>
</body>
</html>
